aid: eye-security
name: Eye Security
description: 'Eye Security is a European cybersecurity company providing managed detection
  and response (MDR) and managed XDR for mid-market organizations across logistics, manufacturing,
  healthcare, and professional services. It combines AI-driven threat detection with a 24/7
  Security Operations Center (SOC), incident response and threat hunting, security awareness
  training, EU-native log retention, and integrated cyber insurance. Headquartered in Europe
  with an EU-focused stance on compliance and data residency, Eye positions itself as
  enterprise-grade security made for the mid-market. This API Evangelist profile tracks the
  company''s public developer, security, and product surface.'
